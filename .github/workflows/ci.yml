name: CI

# Every job calls the project CLI, `st`, and prints the command it runs first. `gate` is the one
# check main requires; release.yml calls this workflow before it builds the documentation bundle.
#
# Pre-merge: the checkers and the CLI's own tests, the build and the small and medium tests on
# Linux and Windows, and the small tests again under ASan and UBSan on Linux. A push to main and
# the nightly run add ThreadSanitizer. The CLI builds SushiLog and SushiProfiler once as packages from the commits
# cli/sushistack.deps.toml pins. Large tests need hardware and run on no runner.

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checkers and CLI tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Command
        shell: bash
        run: echo "python tools/check_all.py . && st test --cli"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The manual cites files inside the submodules, which the documentation checker looks up.
      - name: Fetch the submodules
        run: git submodule update --init --depth 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cli/pyproject.toml
      - name: Install the CLI
        run: python -m pip install -e "./cli[test]"
      - name: Run every checker
        run: python tools/check_all.py .
      - name: Run the CLI's own tests
        run: st test --cli

  linux:
    name: Build and small and medium tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Command
        run: echo "st build && st test"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch Eigen
        run: git submodule update --init --depth 1 third_party/eigen
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cli/pyproject.toml
      - name: Install the toolchain and the CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache libgtest-dev libgmock-dev
          python -m pip install -e ./cli
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-gcc-release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: ccache-linux-gcc-release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-
      - name: Build
        run: st build -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Run the small and medium tests
        run: st test

  windows:
    name: Build and small and medium tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Command
        shell: bash
        run: echo "st build && st test"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch Eigen
        run: git submodule update --init --depth 1 third_party/eigen
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cli/pyproject.toml
      - name: Install GoogleTest
        shell: pwsh
        run: vcpkg install gtest:x64-windows
      - name: Install the CLI
        run: python -m pip install -e ./cli
      # One command per step: pwsh reports only the last command's exit code.
      - name: Build
        shell: pwsh
        run: st build -D "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Run the small and medium tests
        shell: pwsh
        run: st test

  sanitize:
    name: Tests under ${{ matrix.sanitizer }} (Linux)
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address
            labels: --label small
            post_merge_only: false
          - sanitizer: thread
            labels: --label small --label medium
            post_merge_only: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN: ${{ !matrix.post_merge_only || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - name: Command
        run: echo "st build --sanitize ${{ matrix.sanitizer }} && st test ${{ matrix.labels }}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.RUN == 'true'
      - name: Fetch Eigen
        if: env.RUN == 'true'
        run: git submodule update --init --depth 1 third_party/eigen
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: env.RUN == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cli/pyproject.toml
        if: env.RUN == 'true'
      - name: Install the toolchain and the CLI
        if: env.RUN == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache libgtest-dev libgmock-dev
          python -m pip install -e ./cli
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: env.RUN == 'true'
        with:
          path: ~/.cache/ccache
          key: ccache-linux-gcc-${{ matrix.sanitizer }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: ccache-linux-gcc-${{ matrix.sanitizer }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-
      - name: Build
        if: env.RUN == 'true'
        run: st build --sanitize ${{ matrix.sanitizer }} -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Run the tests
        if: env.RUN == 'true'
        run: st test ${{ matrix.labels }}

  gate:
    name: Gate
    if: always()
    needs: [checks, linux, windows, sanitize]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Command
        run: echo "test every pre-merge job result is success"
      - name: Require every pre-merge job
        env:
          RESULTS: ${{ needs.checks.result }} ${{ needs.linux.result }} ${{ needs.windows.result }} ${{ needs.sanitize.result }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
