name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  checkers:
    name: Checkers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: python tools/check_all.py .
        run: python tools/check_all.py .
