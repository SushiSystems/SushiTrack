name: Nightly

# Once a day on main: the whole of ci.yml, which a scheduled run extends with ThreadSanitizer and
# builds against SushiLog's main, then the quarantined tests. The quarantined job reports and
# never gates, so nothing requires it. The MOT benchmarks are not here: their sequences are not in
# git and no runner holds them.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  quarantined:
    name: Quarantined tests (Linux, report only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A quarantined test is a known flaky or broken test with an entry in KNOWN_ISSUES.md. The
    # job shows its state each night and must not turn the run red.
    continue-on-error: true
    steps:
      - name: Command
        run: echo "st build && st test --label quarantined"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch Eigen
        run: git submodule update --init --depth 1 third_party/eigen
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cli/pyproject.toml
      - name: Install the toolchain and the CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache libgtest-dev libgmock-dev
          python -m pip install -e ./cli
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-gcc-release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: ccache-linux-gcc-release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-
      - name: Build
        run: st build
      - name: Run the quarantined tests
        run: st test --label quarantined
