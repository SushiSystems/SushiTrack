[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sushitrack"
version = "1.0.0"
description = "Python bindings for SushiTrack real-time multi-object tracking engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [
    { name = "Mustafa Garip", email = "mustafagarip@sushisystems.io" },
    { name = "Sushi Systems" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
keywords = ["tracking", "sort", "bytetrack", "computer-vision", "multiobject-tracking"]

[tool.setuptools]
py-modules = ["sushitrack"]
