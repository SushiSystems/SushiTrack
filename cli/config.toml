# SushiTrack CLI configuration. Tracked defaults; copy any key into
# config.local.toml to override it per machine (that file is git-ignored).
# Precedence: defaults -> config.toml -> config.local.toml -> ST_* env vars.
# Run `st config` to see the resolved values and where each came from.

[cli]
# CLI appearance, resolved by the shared `sushicore` package (same schema as
# sr/se/sa/sb/sd/hub). Override in config.local.toml or with ST_THEME /
# ST_ICONS / ST_COLOR -- no rebuild needed.
theme = "default"
icons = "text"
color = "auto"

[paths]
source = "source"
include = "include/SushiTrack"
data = "data"
third_party = "third_party"
config = "assets/sushitrack.json"
tests = "tests"
bridge = "applications/tracker_bridge"
benchmarks = "applications/benchmarks"
evaluator = "applications/benchmarks/mot_engine/evaluator"
inference = "applications/inference"
package = "package"

[build]
type = "Debug"
jobs = 0

[docker]
image = "sushitrack"
workdir = "/workspace/sushitrack"
gpus = true

[test]
tracker = "sushitrack"

[tool]
cmake_exe = ""
ctest_exe = ""
generator = ""

[tool.windows]
generator = "Ninja"
