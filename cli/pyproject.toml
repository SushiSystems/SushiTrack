[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sushitrack-cli"
version = "0.1.0"
description = "SushiTrack developer CLI (build / test / eval / infer / run)"
authors = [{ name = "Mustafa Garip", email = "garipm@mef.edu.tr" }]
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
    # The command layer (sushitrack_cli/cli.py) is Typer, the same framework
    # every sibling Sushi* CLI (sa/sb/sd/hub) uses. Rich IS declared directly,
    # even though sushicore.console and typer both bring it in transitively: a
    # package this CLI itself relies on stays a direct dependency so its
    # version floor is stated here rather than left to whatever sushicore or
    # typer happens to pull in.
    "typer>=0.12",
    "rich>=13.0",
    "sushicore>=0.9.3",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Declared rather than assumed: a contributor should not have to guess what
# `python -m pytest cli/tests` needs. The sibling module CLIs do not declare
# this yet; `hub` does.
test = ["pytest>=7.0", "pytest-timeout>=2.3"]

[project.scripts]
st = "sushitrack_cli.cli:entry"
sushitrack = "sushitrack_cli.cli:entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["sushitrack_cli*"]

[tool.setuptools.package-data]
sushitrack_cli = ["py.typed", "templates/*.in"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "small: one process and one thread, no network, no sleep, no file outside the build tree (60 s)",
    "medium: threads and processes, localhost, files in a temporary folder (300 s)",
    "large: real hardware, or a run longer than medium allows (900 s)",
    "quarantined: an intermittent test, out of every gating stage; see docs/reference/KNOWN_ISSUES.md",
]
