[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sushitrack-cli"
version = "0.1.0"
description = "SushiTrack developer CLI (build / test / eval / infer / run)"
authors = [{ name = "Mustafa Garip", email = "garipm@mef.edu.tr" }]
requires-python = ">=3.10"
dependencies = [
    # No Typer: the command layer here is its own thin argparse wrapper
    # (see sushitrack_cli/app.py), not shared with the Typer-based sibling
    # CLIs. Rich IS declared directly, even though sushicore.console is the
    # only thing that imports it: sushicore now brings rich>=13.0 in
    # transitively, but a package this CLI itself relies on (indirectly,
    # through sushicore.console) stays a direct dependency so its version
    # floor is stated here rather than left to whatever sushicore happens
    # to pull in.
    "rich>=13.0",
    "sushicore>=0.1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
st = "sushitrack_cli.cli:entry"
sushitrack = "sushitrack_cli.cli:entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["sushitrack_cli*"]

[tool.setuptools.package-data]
sushitrack_cli = ["py.typed"]
