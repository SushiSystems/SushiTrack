# SushiTrack dependency fragment: the Sushi libraries and the ports this repository needs beyond
# what it vendors under third_party/. `hub` aggregates it with the SushiStack base fragment.
#
# Field reference:
#   description    Human-readable purpose (shown by `hub doctor`).
#   required       false => a missing one warns but does not stop the build.
#   linux_apt      apt package names; empty list = not an apt/vcpkg package.
#   windows_vcpkg  vcpkg port names; empty list = not an apt/vcpkg package.
#   check_cmd      Optional command; exit 0 means "already installed".

[module]
depends_on = ["sushilog", "sushiprofiler"]

# SushiLog, the one logger of the process. The library links it; the CLI builds or reuses its
# package at this tag and hands its config folder to CMake.
[sushisystems.sushilog]
version = "v0.2.3"
commit  = "5f714a7bca6cad1a49e9a6133e75f0f791dba551"

# SushiProfiler, which the zones of Tracker::update record into. v0.3.0 lives on its branch
# feature/live_session; the tag follows the merge of that branch, and until then the commit is the
# branch head.
[sushisystems.sushiprofiler]
version = "v0.3.0"
commit  = "c099165b5106f3004972c98e7adbc8f2f66329f3"

[googletest]
description   = "GoogleTest, for the test programs st build builds unless --no-test is given; see docs/getting_started/INSTALL.md."
required      = false
linux_apt     = ["libgtest-dev", "libgmock-dev"]
windows_vcpkg = ["gtest"]
